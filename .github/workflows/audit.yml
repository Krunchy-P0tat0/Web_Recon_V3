name: WebRecon Audit

on:
  workflow_dispatch:
    inputs:
      audit_id:
        description: "Audit ID"
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build dump
        run: |
          DUMP=/tmp/webrecon_dump.md
          echo "# WebRecon_V3 source dump" > "$DUMP"
          echo "" >> "$DUMP"
          echo "## Root files" >> "$DUMP"
          for f in package.json pnpm-workspace.yaml tsconfig.json tsconfig.base.json KNOWN_ISSUES.md ARCHITECTURE_INDEX.md PROJECT_PLAN.md PROJECT_STATUS.md replit.md; do
            if [ -f "$f" ]; then
              echo "" >> "$DUMP"
              echo "### $f" >> "$DUMP"
              head -c 20000 "$f" >> "$DUMP"
            fi
          done
          echo "" >> "$DUMP"
          echo "## Workflows" >> "$DUMP"
          for f in .github/workflows/*.yml; do
            if [ -f "$f" ]; then
              echo "" >> "$DUMP"
              echo "### $f" >> "$DUMP"
              cat "$f" >> "$DUMP"
            fi
          done
          echo "" >> "$DUMP"
          echo "## File tree" >> "$DUMP"
          find . -type f -not -path "./.git/*" -not -path "*/node_modules/*" | sort | head -800 >> "$DUMP"
          echo "" >> "$DUMP"
          echo "## Package manifests" >> "$DUMP"
          for f in $(find artifacts lib scripts -maxdepth 2 -name package.json 2>/dev/null | sort); do
            echo "" >> "$DUMP"
            echo "### $f" >> "$DUMP"
            head -c 8000 "$f" >> "$DUMP"
          done
          echo "" >> "$DUMP"
          echo "## Key source files" >> "$DUMP"
          for f in $(find artifacts/api-server/src lib -type f -name "*.ts" 2>/dev/null | grep -iE "storage|orchestrat|recover|checkpoint|website-prime|prime|resume|waitForJob" | sort | head -20); do
            echo "" >> "$DUMP"
            echo "### $f" >> "$DUMP"
            head -c 8000 "$f" >> "$DUMP"
          done
          wc -c "$DUMP"

      - name: Call Kimi
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          jq -n --rawfile content /tmp/webrecon_dump.md '{
            model: "kimi-k3",
            messages: [
              {"role": "system", "content": "You audit TypeScript codebases. Cite file paths. Do not guess."},
              {"role": "user", "content": ("Audit this TypeScript monorepo.\n\n" + $content + "\n\nCover: repo shape, API routes, orchestration durability, recovery and checkpoints, Website Prime flow, stage registry, tests, top 5 risks. Cite file paths.")}
            ],
            temperature: 1,
            max_tokens: 8000
          }' > /tmp/kimi_payload.json
          curl -s --max-time 240 https://api.moonshot.ai/v1/chat/completions -H "Content-Type: application/json" -H "Authorization: Bearer $KIMI_API_KEY" -d @/tmp/kimi_payload.json > /tmp/kimi_response.json
          head -c 500 /tmp/kimi_response.json
          jq -r '.choices[0].message.content // "(no content)"' /tmp/kimi_response.json > /tmp/report.md
          wc -c /tmp/report.md

      - name: Post result to Worker
        if: always()
        env:
          WORKER_URL: https://webrecon-ai-bridge.christopheruduma77.workers.dev
          WEBHOOK_SECRET: ${{ secrets.WORKER_WEBHOOK_SECRET }}
          AUDIT_ID: ${{ github.event.inputs.audit_id }}
        run: |
          if [ -s /tmp/report.md ]; then
            REPORT=$(cat /tmp/report.md)
            PAYLOAD=$(jq -n --arg id "$AUDIT_ID" --arg r "$REPORT" '{audit_id: $id, status: "done", report: $r}')
          else
            PAYLOAD=$(jq -n --arg id "$AUDIT_ID" '{audit_id: $id, status: "error", error: "Kimi call failed"}')
          fi
          curl -s -X POST "$WORKER_URL/audit/complete" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "$PAYLOAD"