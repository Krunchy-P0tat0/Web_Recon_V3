name: WebRecon Labs Validation

on:
  push:
    branches: [ lab-merge ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck dashboard
        run: pnpm --filter "./artifacts/dashboard" run typecheck

      - name: Typecheck mockup sandbox
        run: pnpm --filter "./artifacts/mockup-sandbox" run typecheck

      - name: Typecheck scripts
        run: pnpm --filter "./scripts" run typecheck