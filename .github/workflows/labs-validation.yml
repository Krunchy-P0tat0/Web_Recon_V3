name: WebRecon Labs Validation

on:
  push:
    branches:
      - lab-merge
      - 'agent/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck libs
        id: tc_libs
        continue-on-error: true
        run: pnpm run typecheck:libs 2>&1 | tee /tmp/tc-libs.log

      - name: Typecheck dashboard
        id: tc_dashboard
        continue-on-error: true
        run: pnpm --filter "./artifacts/dashboard" run typecheck 2>&1 | tee /tmp/tc-dashboard.log

      - name: Typecheck mockup sandbox
        id: tc_mockup
        continue-on-error: true
        run: pnpm --filter "./artifacts/mockup-sandbox" run typecheck 2>&1 | tee /tmp/tc-mockup.log

      - name: Typecheck scripts
        id: tc_scripts
        continue-on-error: true
        run: pnpm --filter "./scripts" run typecheck 2>&1 | tee /tmp/tc-scripts.log

      # api-server is deliberately excluded from typechecking.
      # It has ~11 pre-existing type errors from the Replit-era codebase,
      # tracked in KNOWN_ISSUES.md. When those are fixed, add:
      #   - name: Typecheck api-server
      #     id: tc_api
      #     continue-on-error: true
      #     run: pnpm --filter "./artifacts/api-server" run typecheck 2>&1 | tee /tmp/tc-api.log
      # and include steps.tc_api.outcome in the check below.

      - name: Determine overall result
        id: tc
        if: always()
        run: |
          if [ "${{ steps.tc_libs.outcome }}" = "failure" ] || \
             [ "${{ steps.tc_dashboard.outcome }}" = "failure" ] || \
             [ "${{ steps.tc_mockup.outcome }}" = "failure" ] || \
             [ "${{ steps.tc_scripts.outcome }}" = "failure" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      - name: Report to bridge
        if: always()
        env:
          BRIDGE_URL: https://webrecon-ai-bridge.christopheruduma77.workers.dev
          WEBHOOK_SECRET: ${{ secrets.WORKER_WEBHOOK_SECRET }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ steps.tc.outputs.result }}
        run: |
          echo "Branch: $BRANCH_NAME"
          echo "Result: $RESULT"

          if [ "$RESULT" = "failure" ]; then
            LOG=$(cat /tmp/tc-libs.log /tmp/tc-dashboard.log /tmp/tc-mockup.log /tmp/tc-scripts.log 2>/dev/null | grep -i "error TS" | head -50 || echo "")
            LOG_B64=$(echo "$LOG" | base64 -w0)
          else
            LOG_B64=""
          fi

          curl -s -X POST "$BRIDGE_URL/store-test-result" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"branch\":\"$BRANCH_NAME\",\"run_id\":\"$RUN_ID\",\"status\":\"$RESULT\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"log_b64\":\"$LOG_B64\"}"

      - name: Fail job if typechecks failed
        if: steps.tc.outputs.result == 'failure'
        run: |
          echo "One or more typechecks failed. See logs above."
          exit 1