name: WebRecon Labs Validation

on:
  push:
    branches:
      - lab-merge
      - 'agent/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run typechecks
        id: tc
        run: |
          set +e
          pnpm run typecheck:libs > /tmp/tc-libs.log 2>&1
          E1=$?
          pnpm --filter "./artifacts/dashboard" run typecheck > /tmp/tc-dashboard.log 2>&1
          E2=$?
          pnpm --filter "./artifacts/mockup-sandbox" run typecheck > /tmp/tc-mockup.log 2>&1
          E3=$?
          pnpm --filter "./scripts" run typecheck > /tmp/tc-scripts.log 2>&1
          E4=$?
          if [ $E1 -ne 0 ] || [ $E2 -ne 0 ] || [ $E3 -ne 0 ] || [ $E4 -ne 0 ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Report to bridge
        if: always()
        env:
          BRIDGE_URL: https://webrecon-ai-bridge.christopheruduma77.workers.dev
          WEBHOOK_SECRET: ${{ secrets.WORKER_WEBHOOK_SECRET }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ steps.tc.outputs.result }}
        run: |
          echo "Branch: $BRANCH_NAME"
          echo "Result: $RESULT"

          if [ "$RESULT" = "failure" ]; then
            LOG=$(cat /tmp/tc-libs.log /tmp/tc-dashboard.log /tmp/tc-mockup.log /tmp/tc-scripts.log 2>/dev/null | grep -i "error TS" | head -50 || echo "")
            LOG_B64=$(echo "$LOG" | base64 -w0)
          else
            LOG_B64=""
          fi

          curl -s -X POST "$BRIDGE_URL/store-test-result" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"branch\":\"$BRANCH_NAME\",\"run_id\":\"$RUN_ID\",\"status\":\"$RESULT\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"log_b64\":\"$LOG_B64\"}"