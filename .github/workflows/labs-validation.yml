name: WebRecon Labs Validation

on:
  push:
    branches: [ lab-merge ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs

      - name: Typecheck dashboard
        run: pnpm --filter "./artifacts/dashboard" run typecheck

      - name: Typecheck mockup sandbox
        run: pnpm --filter "./artifacts/mockup-sandbox" run typecheck

      - name: Typecheck scripts
        run: pnpm --filter "./scripts" run typecheck

      - name: Report success to bridge
        if: success()
        env:
          BRIDGE_URL: https://webrecon-ai-bridge.christopheruduma77.workers.dev
          WEBHOOK_SECRET: ${{ secrets.WORKER_WEBHOOK_SECRET }}
        run: |
          curl -s -X POST "$BRIDGE_URL/store-test-result" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"branch\":\"lab-merge\",\"run_id\":\"$GITHUB_RUN_ID\",\"status\":\"success\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Report failure to bridge
        if: failure()
        env:
          BRIDGE_URL: https://webrecon-ai-bridge.christopheruduma77.workers.dev
          WEBHOOK_SECRET: ${{ secrets.WORKER_WEBHOOK_SECRET }}
        run: |
          curl -s -X POST "$BRIDGE_URL/store-test-result" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"branch\":\"lab-merge\",\"run_id\":\"$GITHUB_RUN_ID\",\"status\":\"failure\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"